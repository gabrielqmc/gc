# Mantém o site em dia sempre que projetos.json ou os arquivos de src/ mudam:
# tira o print dos projetos que ainda não têm imagem e gera o HTML/CSS final.
# Também pode ser rodado à mão (aba "Actions") para refazer todos os prints.
name: Atualizar site

on:
  push:
    branches: [main]
    paths:
      - projetos.json
      - src/**
      - scripts/**
      - tailwind.config.js
  workflow_dispatch:
    inputs:
      refazer_prints:
        description: "Refazer o print de TODOS os projetos?"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: portfolio
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Tirar prints
        run: |
          if [ "${{ inputs.refazer_prints }}" = "true" ]; then
            node scripts/capturar.mjs --todos
          else
            node scripts/capturar.mjs
          fi

      - name: Gerar site
        run: node scripts/build.mjs

      - name: Publicar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Atualiza prints e páginas do portfólio"
            git push
          fi

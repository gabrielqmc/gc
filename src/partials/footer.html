    <script>
        // Menu mobile: abre/fecha e fecha ao clicar em um link
        (function () {
            var botao = document.getElementById('menu-toggle');
            var menu = document.getElementById('menu-mobile');
            if (!botao || !menu) return;
            function definir(aberto) {
                menu.classList.toggle('hidden', !aberto);
                botao.setAttribute('aria-expanded', aberto ? 'true' : 'false');
                botao.setAttribute('aria-label', aberto ? 'Fechar menu' : 'Abrir menu');
                botao.querySelector('i').className = 'ph ' + (aberto ? 'ph-x' : 'ph-list');
            }
            botao.addEventListener('click', function () { definir(menu.classList.contains('hidden')); });
            menu.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', function () { definir(false); }); });
            document.addEventListener('keydown', function (e) { if (e.key === 'Escape') definir(false); });
        })();
    </script>

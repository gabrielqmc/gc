    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{titulo}}</title>
    <meta name="theme-color" content="#111110">

    <!-- SEO Básico -->
    <meta name="description" content="{{descricao}}">
    <meta name="author" content="Gabriel Capinzaiki">
    <meta name="robots" content="index, follow">
    {{canonical}}

    <!-- Open Graph / Redes Sociais (WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ogTitulo}}">
    <meta property="og:description" content="{{ogDescricao}}">
    <meta property="og:image" content="{{ogImagem}}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Gabriel Capinzaiki - Web Designer Portfolio">
    <meta property="og:site_name" content="Gabriel Capinzaiki">
    <meta property="og:locale" content="pt_BR">
    {{ogUrl}}

    <!-- Twitter Card (Twitter / X) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ogTitulo}}">
    <meta name="twitter:description" content="{{ogDescricao}}">
    <meta name="twitter:image" content="{{ogImagem}}">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23111110'/><text x='50' y='68' font-family='sans-serif' font-weight='600' font-size='46' text-anchor='middle' fill='%23EEEDE9'>GC<tspan fill='%23A3B899'>.</tspan></text></svg>">

    <!-- Fontes: Geist (texto e títulos), Geist Mono (legendas), Instrument Serif (contraste editorial) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{raiz}}assets/css/style.css?v={{versaoCss}}">

    <script>
        // Marca que o JS está ativo (os estados iniciais das animações dependem disso).
        // Se o script principal não carregar em 6s, mostra o conteúdo mesmo assim.
        (function (d) {
            var h = d.documentElement;
            h.classList.add('js');
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) h.classList.add('reduced');
            setTimeout(function () { if (!window.__gcPronto) { h.classList.remove('js'); h.classList.add('reduced'); } }, 6000);
        })(document);
    </script>
